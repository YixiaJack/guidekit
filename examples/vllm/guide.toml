# vLLM, explained: a reading guide to the vLLM codebase (kind = code)
[guide]
id = "vllm"
title = "vLLM, explained"
kind = "code"
audience = "beginners"
root = "~/vllm-kb"
words = [5000, 7000]
max_code = 30
review_model = "opus"

[source]
repo = "vllm-project/vllm"
tag = "v0.34.0"
commit = "62d4bc3c7e33b1b6c906e233e6af2d3506c482ca"
intro = """
You are writing one chapter of **vLLM, explained**: a reading guide to the vLLM codebase for people who know deep
learning but have never read an inference engine. vLLM is huge (about 1.3 million lines of Python in `vllm/` alone,
plus CUDA/C++ kernels), and its code *is* the thing worth learning: why a scheduler, a paged KV cache or a model
runner is built the way it is. Each chapter takes one part of the system and walks the reader from the problem, to
the mental model, to the actual code, with the design reasons from vLLM's own design docs and RFCs.
"""
readers = """
The reader knows PyTorch, transformers and attention, and has used vLLM as a user at most. Never run, import or install vLLM code.
"""
rules = """
Docs often lag the code: when they disagree, the code at the pinned commit is the truth; say so in the pitfalls section.
"""

[[store]]
kind = "path"
format = "repo"
root = "~/code-kb/src/vllm-v0.34.0"
prefixes = ["vllm", "docs", "csrc", "benchmarks", "examples", "tests", "tools", "requirements"]

[[store]]
kind = "issue"
format = "thread"
dirs = ["~/code-kb/src/vllm-rfc"]

[[store]]
kind = "pr"
format = "thread"
dirs = ["~/code-kb/src/vllm-rfc"]


[[chapter]]
id = "intro-engine"
title = "What an inference engine is for"
words = [2000, 3500]
track = "beginner"

[[chapter]]
id = "intro-request"
title = "One request through vLLM, in twenty minutes"
words = [2000, 3500]
track = "beginner"

[[chapter]]
id = "intro-memory"
title = "KV cache and continuous batching, intuitively"
words = [2000, 3500]
track = "beginner"

[[chapter]]
id = "intro-map"
title = "A map of the code: what to read first"
words = [2000, 3500]
track = "beginner"

[[chapter]]
id = "intro-handson"
title = "Hands-on: watch vLLM work on your machine"
words = [2000, 3500]
track = "beginner"

[[chapter]]
